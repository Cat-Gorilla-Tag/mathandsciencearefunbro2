<html lang="en"><head>
    <meta charset="UTF-8">
    <title>Shell Shockers - Frame</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font: 14px Arial, sans-serif;
        color: #333333;
      }

      .spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 4px solid #ccc;
        border-top-color: #333;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        z-index: 10;
        display: none;
      }

      .spinner.spin {
        display: block;
      }

      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .warning {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        display: none;
        font-size: 1.3em;
        text-align: center;
        line-height: 1.6em;
      }

      .warning.show {
        display: block;
      }

      #game {
        width: 100vw;
        height: 100vh;
        border: none;
      }
    </style>
    <link rel="canonical" href="https://www.rocketgames.io/game/shell-shockers">
    <!-- Google tag (gtag.js) -->
    <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-YRGRPWQL1R"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-YRGRPWQL1R', {
            send_page_view: false
        });
    </script>
</head>
<body>
<div class="spinner"></div>
<div class="warning">Unfortunately, this game is not currently available in your location.<br>Please try again later. :(</div>
<iframe id="game" tabindex="0" src="https://shellshock.io/"></iframe>
<script src="dist/main.js"></script>

</body></html>
